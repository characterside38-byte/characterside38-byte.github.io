<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chacha Ruko Toh 3D — Story Mode</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#04060b;color:#fff;font-family:system-ui,sans-serif;height:100dvh;overflow:hidden;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.pill{background:rgba(15,23,42,.88);backdrop-filter:blur(8px);border:1px solid rgba(250,204,21,.45);padding:6px 12px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:0 4px 15px rgba(0,0,0,.6)}
.btn-top{pointer-events:auto;background:#facc15;color:#060b19;border:none;padding:6px 12px;border-radius:99px;font-weight:900;font-size:12px}
#overlay{position:fixed;inset:0;background:rgba(4,6,11,.78);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#overlay h1{color:#facc15;font-size:1.7rem;margin-bottom:8px;text-shadow:0 2px 12px rgba(250,204,21,.4)}
#overlay p{color:#cbd5e1;font-size:14px;margin-bottom:18px;max-width:300px}
.start-btn{background:linear-gradient(135deg,#facc15,#f59e0b);color:#060b19;border:none;padding:13px 28px;border-radius:99px;font-weight:900;font-size:16px;box-shadow:0 0 25px rgba(250,204,21,.5)}
#skipBtn{display:none;position:fixed;bottom:52px;right:14px;background:rgba(15,23,42,.85);border:1px solid #facc15;color:#facc15;padding:6px 14px;border-radius:99px;font-weight:800;font-size:12px;z-index:15}
#timerBadge{display:none;position:fixed;top:54px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.88);border:1px solid #38bdf8;color:#38bdf8;padding:4px 14px;border-radius:99px;font-weight:800;font-size:12px;z-index:15}
#tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#94a3b8;font-size:12px;font-weight:700;z-index:10;text-align:center;width:92%}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">🏃 <b id="sc">0</b>m</div>
  <div class="pill">🪙 <b id="cn">0</b></div>
  <div style="display:flex;gap:5px;pointer-events:auto">
    <button class="btn-top" style="background:#1e293b;color:#fff;border:1px solid #334155" id="sndBtn" onclick="toggleSnd()">🔊</button>
    <button class="btn-top" onclick="startStory()">Restart</button>
  </div>
</div>

<div id="overlay">
  <h1 id="ovTitle">🏃 Chacha Ruko Toh 3D</h1>
  <p id="ovSub">Watch the face-off & help Chacha escape!</p>
  <button class="start-btn" onclick="startStory()">▶ Play Story</button>
</div>

<div id="timerBadge">🗣️ Talking... <b id="tLeft">6</b>s</div>
<button id="skipBtn" onclick="skipIntro()">Skip Intro ⏭</button>
<div id="tip">👆 Swipe Left/Right • Up: Jump • Down: Slide</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LOOP_START = 6.5;
const memeAudio = new Audio('chacha.mp4?v=3');
memeAudio.playsInline = true;
memeAudio.volume = 1.0;

memeAudio.addEventListener('ended', () => {
  memeAudio.currentTime = LOOP_START;
  if (snd && mode === 'run') memeAudio.play().catch(() => {});
});

let snd = true, actx = null;
function toggleSnd() {
  snd = !snd;
  document.getElementById('sndBtn').textContent = snd ? '🔊' : '🔇';
  if (snd && mode !== 'wait') memeAudio.play().catch(() => {});
  else memeAudio.pause();
}

function beep(freq, dur = 0.1) {
  if (!snd) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
  g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + dur);
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.FogExp2(0x05070d, 0.016);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.AmbientLight(0x334155, 0.9));
const spot = new THREE.DirectionalLight(0xfef08a, 1.15);
spot.position.set(10, 24, 12); spot.castShadow = true;
spot.shadow.mapSize.width = 1024; spot.shadow.mapSize.height = 1024;
const d = 24;
spot.shadow.camera.left = -d; spot.shadow.camera.right = d;
spot.shadow.camera.top = d; spot.shadow.camera.bottom = -d;
scene.add(spot);

const LANES = [-3.0, 0, 3.0];
const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 360), new THREE.MeshStandardMaterial({ color: 0x181c24, roughness: 0.85 }));
road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);

const lineMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
[-5.6, 5.6].forEach(lx => {
  const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 360), lineMat);
  edge.rotation.x = -Math.PI / 2; edge.position.set(lx, 0.02, -140); scene.add(edge);
});

const dashes = [];
const dashGeo = new THREE.PlaneGeometry(0.18, 3.2);
for (let i = 0; i < 36; i++) {
  [-1.5, 1.5].forEach(lx => {
    const m = new THREE.Mesh(dashGeo, lineMat);
    m.rotation.x = -Math.PI / 2; m.position.set(lx, 0.02, -i * 10);
    scene.add(m); dashes.push(m);
  });
}

const wall = new THREE.Mesh(new THREE.BoxGeometry(1.5, 5.5, 360), new THREE.MeshStandardMaterial({ color: 0x262930, roughness: 0.9 }));
wall.position.set(-7.5, 2.75, -140); wall.receiveShadow = true; scene.add(wall);

const lamps = [];
const poleMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6 });
const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
const glowMat = new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.28 });

for (let i = 0; i < 22; i++) {
  const lampGrp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 7.5, 8), poleMat); pole.position.y = 3.75;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.12), poleMat); arm.position.set(-0.8, 7.4, 0);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 10), bulbMat); bulb.position.set(-1.6, 7.3, 0);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.85, 10, 10), glowMat); halo.position.set(-1.6, 7.3, 0);
  lampGrp.add(pole, arm, bulb, halo);
  lampGrp.position.set(6.8, 0, -i * 16);
  scene.add(lampGrp); lamps.push(lampGrp);
}

function buildChacha() {
  const grp = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xd99b66, roughness: 0.55 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0x3b6ea5, roughness: 0.6 });
  const shortMat = new THREE.MeshStandardMaterial({ color: 0xc2b29b, roughness: 0.75 });
  const gamchhaMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.8 });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.88, 1.05, 0.48), shirtMat);
  torso.position.y = 1.48; torso.castShadow = true; grp.add(torso);

  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.09, 8, 16), gamchhaMat);
  collar.rotation.x = Math.PI / 2.2; collar.position.set(0, 1.98, 0.02); grp.add(collar);

  const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.68, 0.06), gamchhaMat);
  tailL.position.set(-0.22, 1.62, -0.26); tailL.rotation.z = 0.08;
  const tailR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.68, 0.06), gamchhaMat);
  tailR.position.set(0.22, 1.62, -0.26); tailR.rotation.z = -0.08;
  grp.add(tailL, tailR);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), skinMat);
  head.position.y = 2.32; head.castShadow = true; grp.add(head);

  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
  hair.position.set(0, 2.36, 0.03); grp.add(hair);

  const makeLeg = (x) => {
    const piv = new THREE.Group(); piv.position.set(x, 0.96, 0);
    const shortPart = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.45, 0.34), shortMat); shortPart.position.y = -0.22;
    const calf = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.48, 0.22), skinMat); calf.position.y = -0.66;
    const chappal = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.08, 0.38), new THREE.MeshStandardMaterial({ color: 0x0f172a })); chappal.position.set(0, -0.92, -0.05);
    piv.add(shortPart, calf, chappal); grp.add(piv); return piv;
  };

  const makeArm = (x) => {
    const piv = new THREE.Group(); piv.position.set(x, 1.92, 0);
    const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.3, 0.24), shirtMat); sleeve.position.y = -0.15;
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.55, 0.19), skinMat); arm.position.y = -0.55;
    piv.add(sleeve, arm); grp.add(piv); return piv;
  };

  return { grp, legL: makeLeg(-0.22), legR: makeLeg(0.22), armL: makeArm(-0.56), armR: makeArm(0.56), tailL, tailR };
}

function buildChaserBoy() {
  const grp = new THREE.Group();
  const hoodie = new THREE.Mesh(new THREE.BoxGeometry(0.82, 1.0, 0.45), new THREE.MeshStandardMaterial({ color: 0xef4444 })); hoodie.position.y = 1.42; grp.add(hoodie);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 14), new THREE.MeshStandardMaterial({ color: 0xfdba74 })); head.position.y = 2.22; grp.add(head);
  const mkLimb = (x, y, h, col) => {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.24, h, 0.24), new THREE.MeshStandardMaterial({ color: col })); m.position.y = -h / 2; p.add(m); grp.add(p); return p;
  };
  const legL = mkLimb(-0.2, 0.9, 0.88, 0x1e293b), legR = mkLimb(0.2, 0.9, 0.88, 0x1e293b);
  const armL = mkLimb(-0.52, 1.85, 0.78, 0xfdba74), armR = mkLimb(0.52, 1.85, 0.78, 0xfdba74);
  const phone = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.28, 0.04), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
  phone.position.set(0, -0.78, -0.15); armR.add(phone);
  return { grp, legL, legR, armL, armR };
}

const chacha = buildChacha(); scene.add(chacha.grp);
const boy = buildChaserBoy(); scene.add(boy.grp);

let items = [];
const coinGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.14, 16).rotateX(Math.PI / 2);
const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.5, metalness: 0.8 });

function spawnRow(zPos) {
  const safe = Math.floor(Math.random() * 3);
  [0, 1, 2].forEach(l => {
    if (l === safe) {
      for (let i = 0; i < 4; i++) {
        const c = new THREE.Mesh(coinGeo, coinMat);
        c.position.set(LANES[l], 0.85, zPos - i * 2.5);
        scene.add(c); items.push({ mesh: c, type: 'coin' });
      }
    } else if (Math.random() < 0.8) {
      const r = Math.random();
      if (r < 0.45) {
        const bar = new THREE.Group();
        const board = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.75, 0.35), new THREE.MeshStandardMaterial({ color: 0xfacc15 })); board.position.y = 0.85;
        const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.2, 0.3), new THREE.MeshStandardMaterial({ color: 0x1e293b })); l1.position.set(-0.95, 0.6, 0);
        const l2 = l1.clone(); l2.position.x = 0.95;
        bar.add(board, l1, l2); bar.position.set(LANES[l], 0, zPos);
        scene.add(bar); items.push({ mesh: bar, type: 'low' });
      } else if (r < 0.75) {
        const sign = new THREE.Group();
        const top = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.15, 0.35), new THREE.MeshStandardMaterial({ color: 0x0284c7 })); top.position.y = 2.3;
        const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.85, 0.25), new THREE.MeshStandardMaterial({ color: 0x475569 })); p1.position.set(-1.1, 1.42, 0);
        const p2 = p1.clone(); p2.position.x = 1.1;
        sign.add(top, p1, p2); sign.position.set(LANES[l], 0, zPos);
        scene.add(sign); items.push({ mesh: sign, type: 'high' });
      } else {
        const truck = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.4, 5.2), new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 })); body.position.y = 1.3;
        const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), bulbMat); hl1.position.set(-0.7, 0.8, 2.62);
        const hl2 = hl1.clone(); hl2.position.x = 0.7;
        truck.add(body, hl1, hl2); truck.position.set(LANES[l], 0, zPos - 2);
        scene.add(truck); items.push({ mesh: truck, type: 'truck' });
      }
    }
  });
}

let mode = 'wait';
let introTimer = 0, dist = 0, coins = 0, spd = 0.62, tick = 0;
let laneIdx = 1, curX = 0, py = 0, vy = 0, slideT = 0, boyZ = 2.8, nextZ = -45;

function startStory() {
  items.forEach(i => scene.remove(i.mesh)); items = [];
  mode = 'intro';
  introTimer = 0;
  dist = 0; coins = 0; spd = 0.62;
  laneIdx = 1; curX = 0; py = 0; vy = 0; slideT = 0; boyZ = 2.6; nextZ = -45;

  chacha.grp.position.set(0, 0, 0);
  chacha.grp.rotation.y = Math.PI;
  chacha.grp.scale.set(1, 1, 1);

  boy.grp.visible = true;
  boy.grp.position.set(0, 0, 2.5);
  boy.grp.rotation.y = 0;

  document.getElementById('overlay').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'block';
  document.getElementById('timerBadge').style.display = 'block';

  try { memeAudio.currentTime = 0; } catch (e) {}
  if (snd) memeAudio.play().catch(() => {});
}

function skipIntro() {
  if (mode !== 'intro') return;
  mode = 'run';
  chacha.grp.rotation.y = 0;
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('timerBadge').style.display = 'none';
  try {
    if (memeAudio.currentTime < LOOP_START) memeAudio.currentTime = LOOP_START;
  } catch (e) {}
}

let sx = 0, sy = 0;
window.addEventListener('touchstart', e => {
  if (mode !== 'run') return;
  if (e.touches[0]) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
}, { passive: true });

window.addEventListener('touchend', e => {
  if (mode !== 'run' || !e.changedTouches[0]) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && laneIdx < 2) laneIdx++;
    else if (dx < 0 && laneIdx > 0) laneIdx--;
  } else {
    if (dy < 0 && py === 0) { vy = 0.42; slideT = 0; beep(320); }
    else if (dy > 0) { slideT = 32; if (py > 0) vy = -0.5; }
  }
});

window.addEventListener('keydown', e => {
  if (mode !== 'run') return;
  const k = e.key.toLowerCase();
  if ((k === 'arrowleft' || k === 'a') && laneIdx > 0) laneIdx--;
  else if ((k === 'arrowright' || k === 'd') && laneIdx < 2) laneIdx++;
  else if ((k === 'arrowup' || k === 'w' || k === ' ') && py === 0) { vy = 0.42; slideT = 0; beep(320); }
  else if (k === 'arrowdown' || k === 's') { slideT = 32; if (py > 0) vy = -0.5; }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  tick++;

  if (mode === 'wait') {
    chacha.grp.position.set(0, 0, 0);
    chacha.grp.rotation.y = Math.PI;
    boy.grp.position.set(0, 0, 2.5);
    camera.position.set(3.4, 2.4, 3.8);
    camera.lookAt(0, 1.5, 1.2);
  }
  else if (mode === 'intro') {
    introTimer += dt;
    const rem = Math.max(0, Math.ceil(LOOP_START - introTimer));
    document.getElementById('tLeft').textContent = rem;

    chacha.legL.rotation.x = 0; chacha.legR.rotation.x = 0;
    chacha.armL.rotation.x = Math.sin(tick * 0.14) * 0.25;
    chacha.armR.rotation.x = -0.4 + Math.cos(tick * 0.18) * 0.35;
    chacha.grp.position.y = Math.abs(Math.sin(tick * 0.08)) * 0.04;

    boy.legL.rotation.x = 0; boy.legR.rotation.x = 0;
    boy.armL.rotation.x = Math.cos(tick * 0.15) * 0.25;
    boy.armR.rotation.x = 0.85 + Math.sin(tick * 0.12) * 0.1;

    const camAngle = 0.42 + Math.sin(introTimer * 0.4) * 0.15;
    camera.position.x = Math.sin(camAngle) * 4.4;
    camera.position.y = 2.35;
    camera.position.z = 1.25 + Math.cos(camAngle) * 3.2;
    camera.lookAt(0, 1.55, 1.25);

    if (introTimer >= LOOP_START) {
      skipIntro();
    }
  }
  else if (mode === 'run') {
    if (memeAudio.duration && memeAudio.currentTime >= memeAudio.duration - 0.15) {
      memeAudio.currentTime = LOOP_START;
    }

    const step = spd * 60 * dt;
    dist += step * 2.2;
    spd = Math.min(1.18, 0.62 + dist * 0.00004);

    chacha.grp.rotation.y *= Math.pow(0.01, dt);

    const targetX = LANES[laneIdx];
    curX += (targetX - curX) * 14 * dt;

    if (py > 0 || vy !== 0) {
      py += vy; vy -= 0.024;
      if (py <= 0) { py = 0; vy = 0; }
    }
    if (slideT > 0) slideT--;
    if (boyZ < 6.4) boyZ += 0.75 * dt;

    dashes.forEach(m => { m.position.z += step; if (m.position.z > 10) m.position.z -= 360; });
    lamps.forEach(l => { l.position.z += step; if (l.position.z > 12) l.position.z -= 352; });

    nextZ += step;
    if (nextZ >= 0) {
      spawnRow(-140);
      nextZ = -26 - Math.random() * 10;
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.mesh.position.z += step;

      if (it.type === 'coin') {
        it.mesh.rotation.y += 3.5 * dt;
        if (Math.abs(it.mesh.position.z) < 1.2 && Math.abs(it.mesh.position.x - curX) < 1.2 && py < 1.8) {
          coins++; dist += 20; beep(780, 0.07);
          scene.remove(it.mesh); items.splice(i, 1); continue;
        }
      } else {
        const zRange = it.type === 'truck' ? 2.6 : 0.85;
        if (Math.abs(it.mesh.position.z) < zRange && Math.abs(it.mesh.position.x - curX) < 1.15) {
          const safe = (it.type === 'low' && py > 1.05) || (it.type === 'high' && slideT > 0);
          if (!safe) {
            scene.remove(it.mesh); items.splice(i, 1);
            beep(140, 0.25);
            if (it.type === 'truck' || boyZ < 2.5) {
              mode = 'over';
              boyZ = 1.1;
              memeAudio.pause();
              document.getElementById('ovTitle').textContent = '😂 Pakde Gaye Chacha!';
              document.getElementById('ovSub').textContent = `Score: ${Math.floor(dist)}m • Coins: ${coins}`;
              document.querySelector('.start-btn').textContent = '🔄 Restart Story';
              document.getElementById('overlay').style.display = 'flex';
            } else {
              boyZ = 1.75;
            }
            continue;
          }
        }
      }

      if (it.mesh.position.z > 20) {
        scene.remove(it.mesh); items.splice(i, 1);
      }
    }

    const run = Math.sin(tick * 0.3) * 0.8;
    chacha.legL.rotation.x = run; chacha.legR.rotation.x = -run;
    chacha.armL.rotation.x = -run * 0.85; chacha.armR.rotation.x = run * 0.85;
    chacha.tailL.rotation.x = 0.3 + Math.sin(tick * 0.4) * 0.25;
    chacha.tailR.rotation.x = 0.3 + Math.cos(tick * 0.4) * 0.25;
    chacha.grp.scale.y = slideT > 0 ? 0.55 : 1.0;
    chacha.grp.position.set(curX, py + Math.abs(Math.cos(tick * 0.3)) * 0.14, 0);

    const bRun = Math.sin(tick * 0.36) * 0.85;
    boy.legL.rotation.x = bRun; boy.legR.rotation.x = -bRun;
    boy.armL.rotation.x = -bRun * 0.8; boy.armR.rotation.x = 0.85;
    boy.grp.visible = boyZ < 5.6 && py < 2.0;
    boy.grp.position.set(curX, Math.abs(Math.cos(tick * 0.36)) * 0.15, boyZ);

    camera.position.x += (curX * 0.55 + Math.sin(tick * 0.25) * 0.06 - camera.position.x) * 7 * dt;
    camera.position.y += (3.8 + py * 0.5 + Math.abs(Math.cos(tick * 0.3)) * 0.08 - camera.position.y) * 7 * dt;
    camera.position.z += (7.0 - camera.position.z) * 5 * dt;
    camera.lookAt(curX * 0.35, 1.5 + py * 0.35, -10);

    document.getElementById('sc').textContent = Math.floor(dist);
    document.getElementById('cn').textContent = coins;
  }

  renderer.render(scene, camera);
}
animate();
</script>
