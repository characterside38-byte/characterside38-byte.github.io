<script>
// Smart YouTube App Deep Link (Opens App first, falls back to Browser)
function openYTApp(e){
  const ua = navigator.userAgent || '';
  const webUrl = 'https://www.youtube.com/@x00m_y?sub_confirmation=1';
  if(/Android/i.test(ua)){
    e.preventDefault();
    window.location.href = 'intent://www.youtube.com/@x00m_y#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=' + encodeURIComponent(webUrl) + ';end';
    return false;
  } else if(/iPhone|iPad|iPod/i.test(ua)){
    e.preventDefault();
    window.location.href = 'youtube://www.youtube.com/@x00m_y';
    setTimeout(() => { window.open(webUrl, '_blank'); }, 1200);
    return false;
  }
  return true;
}

let currentTab = 'movie';
const grid = document.getElementById('grid');

const games = [
  {title:'Chacha Ruko Toh 3D', emoji:'🏃', tag:'Viral Meme', url:'chacha.html?v=3'},
  {title:'Glass Bridge 3D', emoji:'🧊', tag:'Survival', url:'bridge.html'},
  {title:'Galaxy Strike 3D', emoji:'🚀', tag:'Space Action', url:'space.html'},
  {title:'Chibi Ghost Maze', emoji:'👻', tag:'Arcade', url:'ghost.html'}
];

function setTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('q').value = '';
  loadContent();
}

function doSearch(){
  loadContent(document.getElementById('q').value.trim());
}

async function loadContent(query=''){
  grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px">Loading...</p>';
  if(currentTab === 'game'){
    const list = games.filter(g => g.title.toLowerCase().includes(query.toLowerCase()));
    grid.innerHTML = list.map(g => `
      <div class="card" onclick="openGame('${g.url}','${g.title}')">
        <div class="poster">${g.emoji}</div>
        <div class="info">
          <h3>${g.title}</h3>
          <div class="meta">${g.tag} • 3D Browser</div>
          <div class="btn">▶ Play Now</div>
        </div>
      </div>`).join('') + `
      <a class="card" href="https://araplhn.org/4/b9f04a7b59d53fec8ea462d70c3bf677" target="_blank" rel="noopener" style="text-decoration:none;color:#fff">
        <div class="poster">🎁</div>
        <div class="info">
          <h3>More 3D Games</h3>
          <div class="meta">Bonus Collection</div>
          <div class="btn" style="background:#facc15">⚡ Unlock</div>
        </div>
      </a>`;
    return;
  }

  try {
    if(currentTab === 'anime'){
      const url = query ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=12` : `https://api.jikan.moe/v4/top/anime?limit=12`;
      const res = await (await fetch(url)).json();
      grid.innerHTML = res.data.map(a => `
        <div class="card" onclick='showDetail(${JSON.stringify({
          title: a.title,
          img: a.images.jpg.image_url,
          release: a.aired?.string || "N/A",
          rating: a.score ? a.score + " / 10 ⭐" : "N/A",
          genre: (a.genres||[]).map(g=>g.name).join(", ") || "Anime",
          extra: "Episodes: " + (a.episodes || "Ongoing") + " | Rank: #" + (a.rank || "-"),
          desc: a.synopsis || "No description available."
        }).replace(/'/g,"&#39;")})'>
          <img class="poster" src="${a.images.jpg.image_url}" alt="${a.title}">
          <div class="info">
            <h3>${a.title}</h3>
            <div class="meta">⭐ ${a.score || 'N/A'} • ${a.year || 'Anime'}</div>
            <div class="btn">View Details</div>
          </div>
        </div>`).join('');
    }
    else if(currentTab === 'movie'){
      const term = query || 'Avengers';
      const res = await (await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=movie&limit=12`)).json();
      grid.innerHTML = res.results.map(m => {
        const hiImg = m.artworkUrl100.replace('100x100bb','400x400bb');
        return `
        <div class="card" onclick='showDetail(${JSON.stringify({
          title: m.trackName,
          img: hiImg,
          release: (m.releaseDate||"").slice(0,10),
          rating: m.contentAdvisoryRating || "PG-13",
          genre: m.primaryGenreName || "Movie",
          extra: "Director: " + (m.artistName || "N/A") + " | Price: $" + (m.trackPrice || "9.99"),
          desc: m.longDescription || m.shortDescription || "Tap below to watch explanation on YouTube."
        }).replace(/'/g,"&#39;")})'>
          <img class="poster" src="${hiImg}" alt="${m.trackName}">
          <div class="info">
            <h3>${m.trackName}</h3>
            <div class="meta">📅 ${(m.releaseDate||'').slice(0,4)} • ${m.primaryGenreName}</div>
            <div class="btn">Movie Info</div>
          </div>
        </div>`;
      }).join('');
    }
    else if(currentTab === 'music'){
      const term = query || 'Arijit Singh';
      const res = await (await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=12`)).json();
      grid.innerHTML = res.results.map(s => {
        const hiImg = s.artworkUrl100.replace('100x100bb','400x400bb');
        return `
        <div class="card" onclick='showDetail(${JSON.stringify({
          title: s.trackName,
          img: hiImg,
          release: (s.releaseDate||"").slice(0,10),
          rating: "Trending Track 🎵",
          genre: s.primaryGenreName || "Music",
          extra: "Artist: " + s.artistName + " | Album: " + s.collectionName,
          desc: "Listen & check full track details. Artist: " + s.artistName
        }).replace(/'/g,"&#39;")})'>
          <img class="poster" src="${hiImg}" alt="${s.trackName}">
          <div class="info">
            <h3>${s.trackName}</h3>
            <div class="meta">🎤 ${s.artistName}</div>
            <div class="btn">Song Info</div>
          </div>
        </div>`;
      }).join('');
    }
  } catch(e){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#ef4444">Network error, try again!</p>';
  }
}

function showDetail(d){
  document.getElementById('dTitle').textContent = d.title;
  document.getElementById('dPoster').src = d.img;
  document.getElementById('dStats').innerHTML = `
    <p><b>📅 Release:</b> ${d.release}</p>
    <p><b>⭐ Rating:</b> ${d.rating}</p>
    <p><b>🎭 Type:</b> ${d.genre}</p>
    <p><b>📊 Info:</b> ${d.extra}</p>`;
  document.getElementById('dDesc').textContent = d.desc;
  document.getElementById('detailModal').style.display = 'block';
}
function closeDetail(){ document.getElementById('detailModal').style.display = 'none'; }
function openGame(url, title){
  document.getElementById('ptitle').textContent = title;
  document.getElementById('gframe').src = url;
  document.getElementById('player').style.display = 'flex';
}
function closeGame(){
  document.getElementById('gframe').src = '';
  document.getElementById('player').style.display = 'none';
}

// Silent Visit Counter
fetch('https://api.counterapi.dev/v1/aeriopox-arcade/visits/up').then(r=>r.json()).then(d=>{
  if(location.search.includes('stats')) alert('Total Real Visits: ' + d.count);
});

loadContent();
</script>
