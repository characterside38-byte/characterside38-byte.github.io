<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aeriopox Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0b1120;color:#fff;padding:20px;text-align:center}
h1{color:#38bdf8;margin-top:10px}
p.sub{color:#94a3b8;font-size:14px;margin-top:6px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;max-width:350px;margin:24px auto}
.icon{font-size:60px;margin-bottom:10px}
.card p{color:#94a3b8;font-size:14px;margin-top:6px}
.btn{display:block;background:#38bdf8;color:#000;font-weight:bold;text-decoration:none;padding:12px;border-radius:10px;margin-top:16px}
</style>
</head>
<body>
  <h1>🎮 Aeriopox Games</h1>
  <p class="sub">Tap to play instantly on Mobile & PC!</p>
  <div class="card">
    <div class="icon">👻</div>
    <h2>Chibi Ghost Maze</h2>
    <p>Collect all yellow coins and dodge the ghosts!</p>
    <a href="ghost.html" class="btn">▶ Play Now</a>
  </div>
</body>
</html>
