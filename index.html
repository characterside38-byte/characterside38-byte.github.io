<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aeriopox Games — Play Free Online Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0b1120;color:#fff;min-height:100vh}
header{background:#0f172a;padding:16px;text-align:center;border-bottom:1px solid #1e293b}
header h1{color:#38bdf8;font-size:1.5rem}
header p{color:#94a3b8;font-size:.85rem;margin-top:4px}
.ad-box{max-width:728px;margin:14px auto;background:#1e293b;border:1px dashed #475569;border-radius:10px;padding:12px;text-align:center;color:#94a3b8;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:900px;margin:16px auto;padding:0 14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden;text-align:center;cursor:pointer;transition:.2s}
.card:active{transform:scale(.97)}
.thumb{height:110px;background:linear-gradient(135deg,#1e1b4b,#0f172a);display:flex;align-items:center;justify-content:center;font-size:3.2rem;position:relative}
.badge{position:absolute;top:8px;right:8px;background:#22c55e;color:#052e16;font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:99px}
.badge.soon{background:#475569;color:#e2e8f0}
.info{padding:12px}
.info h3{font-size:.98rem;margin-bottom:6px}
.play-btn{background:#38bdf8;color:#060b19;border:none;width:100%;padding:8px;border-radius:8px;font-weight:800;font-size:.85rem}
.soon-btn{background:#334155;color:#94a3b8}
/* Fullscreen Game Player Modal */
#player{display:none;position:fixed;inset:0;background:#060b19;z-index:99;flex-direction:column}
#pbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0f172a;border-bottom:1px solid #1e293b}
#pbar button{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-weight:bold}
iframe{flex:1;width:100%;border:none}
</style>
</head>
<body>

<header>
  <h1>🎮 Aeriopox Arcade</h1>
  <p>Tap any game to play instantly — No download needed!</p>
</header>

<!-- Adsterra Banner Slot 1 -->
<div class="ad-box" id="ad-top">📢 Adsterra Banner Ad Space (728x90 / 320x50)</div>

<div class="grid">
  <!-- Game 1 (LIVE) -->
  <div class="card" onclick="openGame('ghost.html','👻 Chibi Ghost Maze')">
    <div class="thumb">👻<span class="badge">LIVE</span></div>
    <div class="info">
      <h3>Chibi Ghost Maze</h3>
      <button class="play-btn">▶ Play Now</button>
    </div>
  </div>

  <!-- Game 2 -->
  <div class="card">
    <div class="thumb">🚀<span class="badge soon">SOON</span></div>
    <div class="info">
      <h3>Space Shooter</h3>
      <button class="play-btn soon-btn">Coming Soon</button>
    </div>
  </div>

  <!-- Game 3 -->
  <div class="card">
    <div class="thumb">🐍<span class="badge soon">SOON</span></div>
    <div class="info">
      <h3>Neon Snake</h3>
      <button class="play-btn soon-btn">Coming Soon</button>
    </div>
  </div>

  <!-- Game 4 -->
  <div class="card">
    <div class="thumb">🧱<span class="badge soon">SOON</span></div>
    <div class="info">
      <h3>Block Breaker</h3>
      <button class="play-btn soon-btn">Coming Soon</button>
    </div>
  </div>
</div>

<!-- Adsterra Banner Slot 2 -->
<div class="ad-box" id="ad-bottom">📢 Adsterra Native / Banner Ad Space</div>

<!-- In-Page Game Player -->
<div id="player">
  <div id="pbar">
    <span id="ptitle" style="font-weight:bold;color:#38bdf8">Game</span>
    <button onclick="closeGame()">✖ Close Game</button>
  </div>
  <iframe id="gframe" src=""></iframe>
</div>

<script>
function openGame(url, title){
  document.getElementById('ptitle').textContent = title;
  document.getElementById('gframe').src = url;
  document.getElementById('player').style.display = 'flex';
}
function closeGame(){
  document.getElementById('gframe').src = '';
  document.getElementById('player').style.display = 'none';
}
</script>
</body>
</html>
