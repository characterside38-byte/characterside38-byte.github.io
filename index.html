body{background:#050816;color:#f8fafc;padding-bottom:75px}
header{background:linear-gradient(135deg,#0f172a,#1e1b4b);padding:14px;text-align:center;border-bottom:1px solid #1e293b}

header p{font-size:.76rem;color:#94a3b8;margin-top:3px}
.yt{display:inline-block;margin-top:8px;background:#ef4444;color:#fff;padding:6px 14px;border-radius:99px;font-size:.76rem;font-weight:800;text-decoration:none}
.ad{display:flex;justify-content:center;margin:8px auto;min-height:50px;overflow:hidden}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#0b1120;position:sticky;top:0;z-index:20;border-bottom:1px solid #1e293b}

.sw{display:flex;gap:6px;padding:8px 10px;max-width:700px;margin:0 auto}
.sw input{flex:1;background:#0f172a;border:1px solid #334155;color:#fff;padding:9px 11px;border-radius:9px;font-size:.84rem;outline:none}
.sw button{background:#38bdf8;color:#060b19;border:none;padding:0 14px;border-radius:9px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:8px 10px;max-width:1100px;margin:0 auto}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.poster{width:100%;height:195px;object-fit:cover;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:2.8rem}
.info{padding:9px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.badge{display:inline-block;background:#1e293b;color:#38bdf8;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:5px;margin-bottom:4px}
.info h3{font-size:.84rem;font-weight:800;line-height:1.25;margin-bottom:4px}
.meta{font-size:.7rem;color:#94a3b8;margin-bottom:7px}
.btn{background:#38bdf8;color:#060b19;text-align:center;padding:6px;border-radius:7px;font-size:.75rem;font-weight:800}
#modal,#player{display:none;position:fixed;inset:0;background:rgba(5,8,22,.96);z-index:100;overflow-y:auto}
.mcard{max-width:440px;margin:20px auto;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:14px}
.mcard img{width:100%;max-height:250px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.mcard h2{font-size:1.05rem;color:#38bdf8;margin-bottom:6px}
.mcard p{font-size:.8rem;color:#cbd5e1;margin-bottom:5px;line-height:1.4}
.cbtn{width:100%;margin-top:10px;background:#ef4444;color:#fff;border:none;padding:9px;border-radius:9px;font-weight:800}
#player{flex-direction:column}
#pbar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0f172a}
#pbar button{background:#ef4444;color:#fff;border:none;padding:5px 11px;border-radius:7px;font-weight:800}
</style>
</head>
<body>

</div>

<script>
function openYT(e){
  const u=navigator.userAgent||'',w='https://www.youtube.com/@x00m_y?sub_confirmation=1';
  if(/Android/i.test(u)){e.preventDefault();location.href='intent://www.youtube.com/@x00m_y#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url='+encodeURIComponent(w)+';end';return false;}
  return true;
}
function fb(el,t){el.onerror=null;el.src='https://placehold.co/300x420/1e293b/38bdf8?text='+encodeURIComponent(t.slice(0,16));}

const movies=[
  {title:'Avengers: Doomsday (2026)',status:'Upcoming • Dec 2026',release:'Dec 18, 2026',rating:'9.4/10 ⭐',genre:'Action/Sci-Fi',img:'https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg',desc:'Robert Downey Jr. returns as Doctor Doom in the multiverse showdown.'},
  {title:'Dune: Messiah (2026)',status:'Upcoming • Dec 2026',release:'Dec 2026',rating:'9.1/10 ⭐',genre:'Sci-Fi/Adventure',img:'https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg',desc:'Paul Atreides faces the consequences of his holy war on Arrakis.'},
  {title:'Pushpa 2: The Rule',status:'Released • Hit',release:'Released',rating:'8.9/10 ⭐',genre:'Action/Drama',img:'https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg',desc:'Pushpa Raj expands his syndicate while clashing with SP Shekhawat.'},
  {title:'Kalki 2898 AD',status:'Released • OTT',release:'Released',rating:'8.7/10 ⭐',genre:'Sci-Fi/Mythology',img:'https://image.tmdb.org/t/p/w500/rCzpDGLbOoPwLjy3OAm5NUPOTrC.jpg',desc:'In future Kasi, Ashwatthama rises to protect the final avatar.'},
  {title:'Spider-Man: Brand New Day',status:'Released • 2026',release:'July 2026',rating:'9.0/10 ⭐',genre:'Superhero',img:'https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg',desc:'Peter Parker starts a fresh chapter against street-level threats.'},
  {title:'The Batman: Part II',status:'Released • 2026',release:'Oct 2026',rating:'9.1/10 ⭐',genre:'Crime/Action',img:'https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg',desc:'Gotham faces a frozen crisis as Bruce Wayne hunts a shadow syndicate.'}
];

const anime=[
  {title:'One Piece: Elbaf Arc',status:'Ongoing • 2026',release:'Weekly Episodes',rating:'9.5/10 ⭐',genre:'Adventure',img:'https://cdn.myanimelist.net/images/anime/1244/138851.jpg',desc:'Straw Hat Pirates reach Elbaf and uncover Void Century secrets.'},
  {title:'Solo Leveling Season 2',status:'Released • #1',release:'Released',rating:'9.3/10 ⭐',genre:'Action/Fantasy',img:'https://cdn.myanimelist.net/images/anime/1448/147351.jpg',desc:'Sung Jin-Woo unleashes the Shadow Army in the Jeju Island raid.'},
  {title:'Demon Slayer: Infinity Castle',status:'Trending Movie',release:'Released',rating:'9.4/10 ⭐',genre:'Dark Fantasy',img:'https://cdn.myanimelist.net/images/anime/1765/135099.jpg',desc:'Hashira and Tanjiro enter Muzan’s Infinity Castle for the final war.'},
  {title:'One-Punch Man Season 3',status:'Latest Season',release:'2026',rating:'9.0/10 ⭐',genre:'Action/Comedy',img:'https://cdn.myanimelist.net/images/anime/12/76049.jpg',desc:'Saitama enters Monster Association HQ as Garou awakens.'}
];

const music=[
  {title:'Trending Phonk & Gaming Beats',status:'Viral 2026',release:'2026 Mix',rating:'🔥 Top Gaming',genre:'Phonk/Bass',img:'https://placehold.co/300x420/1e1b4b/38bdf8?text=PHONK+2026',desc:'High-energy bass beats for BGMI clutches and viral Shorts.'},
  {title:'Arijit Singh Latest Hits 2026',status:'#1 Bollywood',release:'2026',rating:'🎵 Top Charts',genre:'Bollywood',img:'https://placehold.co/300x420/0f172a/f43f5e?text=ARIJIT+2026',desc:'Top Hindi romantic and heartbreak tracks of 2026.'},
  {title:'Bhojpuri DJ Viral Reels Mix',status:'Trending Reels',release:'2026',rating:'🔥 Viral Audio',genre:'Bhojpuri Pop',img:'https://placehold.co/300x420/1e293b/facc15?text=BHOJPURI+DJ',desc:'Top Bhojpuri dance tracks trending on Reels and Shorts.'}
];

const games=[
  {title:'Chacha Ruko Toh 3D',emoji:'🏃',tag:'Viral Meme',url:'chacha.html?v=3'},
  {title:'Glass Bridge 3D',emoji:'🧊',tag:'Survival',url:'bridge.html'},
  {title:'Galaxy Strike 3D',emoji:'🚀',tag:'Space Action',url:'space.html'},
  {title:'Chibi Ghost Maze',emoji:'👻',tag:'Arcade',url:'ghost.html'}
];

const videos=[
  {title:'Full HD Gameplay & Special Video (500MB)',tag:'Telegram Channel',url:'https://t.me/+APNA_CHANNEL_LINK_DAALO',img:'https://placehold.co/400x225/1e293b/38bdf8?text=▶+Watch+Full+Video'}
];

let tab='movie';
const grid=document.getElementById('grid');

function setTab(t,el){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('q').value='';
  render();
}
function doSearch(){render(document.getElementById('q').value.trim());}

function draw(list,btn){
  grid.innerHTML=list.map(x=>`<div class="card" onclick='show(${JSON.stringify(x).replace(/'/g,"&#39;")})'><img class="poster" src="${x.img}" onerror="fb(this,'${x.title.replace(/'/g,'')}')"><div class="info"><div><span class="badge">${x.status}</span><h3>${x.title}</h3><div class="meta">${x.release} • ${x.genre}</div></div><div class="btn">${btn}</div></div></div>`).join('');
}

async function render(q=''){
  if(tab==='game'){
    grid.innerHTML=games.filter(g=>g.title.toLowerCase().includes(q.toLowerCase())).map(g=>`<div class="card" onclick="openGame('${g.url}','${g.title}')"><div class="poster">${g.emoji}</div><div class="info"><h3>${g.title}</h3><div class="meta">${g.tag}</div><div class="btn">▶ Play Now</div></div></div>`).join('')+`<a class="card" href="https://araplhn.org/4/b9f04a7b59d53fec8ea462d70c3bf677" target="_blank" style="text-decoration:none;color:#fff"><div class="poster">🎁</div><div class="info"><h3>More Games</h3><div class="meta">Bonus Pack</div><div class="btn" style="background:#facc15">⚡ Unlock</div></div></a>`;
    return;
  }
  if(tab==='video'){
    grid.innerHTML=videos.map(v=>`<a class="card" href="${v.url}" target="_blank" style="text-decoration:none;color:#fff"><img class="poster" src="${v.img}"><div class="info"><h3>${v.title}</h3><div class="meta">📺 ${v.tag}</div><div class="btn" style="background:#ef4444;color:#fff">▶ Watch on Telegram</div></div></a>`).join('');
    return;
  }
  if(!q){
    if(tab==='movie')draw(movies,'Movie Info');
    if(tab==='anime')draw(anime,'Anime Info');
    if(tab==='music')draw(music,'Track Info');
    return;
  }
  grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#38bdf8;padding:16px">🔍 Searching...</p>';
  try{
    if(tab==='anime'){
      const r=await(await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(q)+'&limit=10')).json();
      const items=(r.data||[]).map(a=>({title:a.title,status:a.status||'Anime',release:a.aired?.string||'N/A',rating:(a.score||'8.5')+'/10 ⭐',genre:(a.genres||[]).map(g=>g.name).join(', ')||'Anime',img:a.images?.jpg?.image_url||'',desc:a.synopsis||'Trending anime series.'}));
      if(items.length)return draw(items,'Anime Info');
    }else{
      const r=await(await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q))).json();
      const items=(r||[]).slice(0,10).map(x=>({title:x.show.name,status:x.show.premiered?'Released ('+x.show.premiered.slice(0,4)+')':'Upcoming',release:x.show.premiered||'Announced',rating:(x.show.rating?.average||'8.2')+'/10 ⭐',genre:(x.show.genres||[]).join(', ')||'Entertainment',img:x.show.image?.medium||'',desc:(x.show.summary||'Watch full details & explanation below.').replace(/<[^>]*>/g,'')}));
      if(items.length)return draw(items,'View Details');
    }
    grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:16px">No result found!</p>';
  }catch(e){draw(movies,'Movie Info');}
}

function show(d){
  document.getElementById('dTitle').textContent=d.title;
  const i=document.getElementById('dImg');i.src=d.img;i.onerror=()=>fb(i,d.title);
  document.getElementById('dStats').innerHTML=`<p><b>📌 Status:</b> ${d.status}</p><p><b>📅 Release:</b> ${d.release}</p><p><b>⭐ Rating:</b> ${d.rating}</p><p><b>🎭 Genre:</b> ${d.genre}</p>`;
  document.getElementById('dDesc').textContent=d.desc;
  document.getElementById('modal').style.display='block';
}
function openGame(u,t){document.getElementById('ptitle').textContent=t;document.getElementById('gframe').src=u;document.getElementById('player').style.display='flex';}
function closeGame(){document.getElementById('gframe').src='';document.getElementById('player').style.display='none';}

fetch('https://api.counterapi.dev/v1/aeriopox-arcade/visits/up').then(r=>r.json()).then(d=>{if(location.search.includes('stats'))alert('Visits: '+d.count);});
render();
</script>
